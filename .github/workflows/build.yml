name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build
        run: cmake --build build -j 4

      # Ad-hoc signature: required for arm64 and enough for Resolume to load the bundle.
      - name: Sign
        run: codesign --force --deep --sign - build/SwarmMorph.bundle

      - name: Package
        run: ditto -c -k --keepParent build/SwarmMorph.bundle SwarmMorph-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SwarmMorph-macOS
          path: SwarmMorph-macOS.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: Compress-Archive -Path build/Release/SwarmMorph.dll -DestinationPath SwarmMorph-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SwarmMorph-Windows
          path: SwarmMorph-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            SwarmMorph-macOS.zip
            SwarmMorph-Windows.zip
